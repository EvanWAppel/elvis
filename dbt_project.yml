name: 'elvis'
version: '1.0.0'
config-version: 2

profile: 'elvis'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
clean-targets: ["target", "dbt_packages"]

models:
  elvis:
    staging:
      +materialized: view
    marts:
      +materialized: table

# CI-only fixtures. These CSVs stand in for the raw.* tables that
# build_warehouse.py loads from live civic sources, so `dbt build` can run
# hermetically (offline, deterministic) in CI. They land in the `raw` schema so
# `source('raw', ...)` resolves to them. Production/local `dbt build` runs with
# `--exclude-resource-type seed` so these fixtures NEVER overwrite the real,
# full-size tables built from the public feeds.
seeds:
  elvis:
    +schema: raw
    road_construction:
      +column_types:
        is_full_closure: boolean
        url: integer
        latitude: double
        longitude: double
    art_work_points:
      +column_types:
        LAT_1: double
        LONG: double
        ObjectId: bigint
