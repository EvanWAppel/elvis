[project]
name = "elvis"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.5",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pydeck>=0.9.3",
    "shapely>=2.1.2",
    "streamlit>=1.61.1",
    "tiresias[streamlit]",
]

[tool.pytest.ini_options]
# Put the repo root on sys.path so the app modules import in tests.
pythonpath = ["."]
testpaths = ["tests/python"]
asyncio_mode = "auto"
markers = [
    "slow: exercises a real model/network path (deselect with -m 'not slow')",
]

[tool.uv.sources]
tiresias = { url = "https://github.com/EvanWAppel/tiresias/archive/bbb34d6d2ebf4c9da9b4d76d20b501470214211b.zip" }

[dependency-groups]
dev = [
    "dbt-duckdb>=1.11.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
    "ty>=0.0.72",
]
