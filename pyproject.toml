[project]
name = "elvis"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.5",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pydeck>=0.9.3",
    "shapely>=2.1.2",
    "streamlit>=1.61.1",
    "tiresias[streamlit]",
]

[tool.pytest.ini_options]
# Put the repo root on sys.path so the app modules import in tests.
pythonpath = ["."]
testpaths = ["tests/python"]
asyncio_mode = "auto"
markers = [
    "slow: exercises a real model/network path (deselect with -m 'not slow')",
]

[tool.uv.sources]
tiresias = { url = "https://github.com/EvanWAppel/tiresias/archive/0ae91238f19070d6453762dee831d110d0f2e5f9.zip" }

[dependency-groups]
dev = [
    "dbt-duckdb>=1.11.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
    "ty>=0.0.72",
]

[tool.ty.src]
# Legacy scratch files that import polars/feynman, which aren't dependencies.
# They aren't part of the app; kept (not deleted) until Evan decides their fate.
exclude = ["./main.py", "./__init__.py", "./scratch.ipynb"]
