[server]
# Railway runs the app headless behind its own proxy; the port/address are
# passed on the command line (see Procfile).
headless = true

[theme]
base = "dark"
primaryColor = "#ff2e88"
backgroundColor = "#0b0a14"
secondaryBackgroundColor = "#16141f"
textColor = "#f4f1e9"
font = "sans serif"
