version: 2

models:
  - name: mart_road_construction
    description: "Metro road construction, one row per mapped segment (NOT per project): Las Vegas and Henderson CIP lines plus optional Nevada 511 NDOT state-route roadwork (present only when the warehouse is built with a 511 key). Henderson emits one row per path part, so count distinct project_name to count projects. Carries status/phase, schedule, road extent, a JSON polyline path for the map, and a WGS84 centroid."
    config:
      contract:
        enforced: true
    columns:
      - name: data_source
        data_type: varchar
        description: "Originating feed: 'City of Las Vegas (CIP)', 'City of Henderson (CIP)', or 'NDOT 511 (state routes)'."
        tests:
          - not_null
      - name: project_name
        data_type: varchar
        description: "Project or event title as published by the source feed."
      - name: description
        data_type: varchar
        description: "Free-text project/event description from the source feed."
      - name: status
        data_type: varchar
        description: "Project status, per source: CLV CIP = PHASE (Design/Bidding/Construction/...) else STATUS; Henderson CIP = PROJECT_PHASE else PROJECT_STATUS; NDOT 511 = event type."
      - name: category
        data_type: varchar
        description: "Work category, per source: CLV CIP = CATEGORY else ProjType; Henderson CIP = always 'Transportation' (set by our loader); NDOT 511 = event subtype."
      - name: road_name
        data_type: varchar
        description: "Primary road: CLV CIP street name; NDOT 511 roadway name; always null for Henderson CIP rows."
      - name: extent
        data_type: varchar
        description: "Affected segment: CLV CIP 'From -> To' streets (else location text); Henderson CIP location description; NDOT 511 direction and lanes affected."
      - name: start_date
        data_type: date
        description: "Start date: CLV CIP construction start, else overall project start; Henderson CIP start date; NDOT 511 event start."
      - name: end_date
        data_type: date
        description: "End date: CLV CIP construction end, else overall project end; Henderson CIP completion date; NDOT 511 planned end. Null when not published."
      - name: contractor
        data_type: varchar
        description: "CLV CIP: contractor. NDOT 511: the reporting organization (not a contractor). Null for Henderson CIP rows."
      - name: is_full_closure
        data_type: boolean
        description: "Full-closure flag, ONLY for NDOT 511 rows (true/false from the event). Null for every CLV and Henderson CIP row, and the whole column is null when the warehouse was built without a 511 key. Never count closures from CIP rows; if no NDOT rows exist, closure questions cannot be answered."
      - name: url
        data_type: varchar
        description: "CLV CIP: project website. Henderson CIP: the ArcGIS layer endpoint (not a project page). NDOT 511: null."
      - name: path_json
        data_type: varchar
        description: "Project geometry as a JSON array of [lon, lat] vertices, for the deck.gl PathLayer."
        tests:
          - not_null
      - name: latitude
        data_type: double
        description: "WGS84 centroid latitude of the project line."
        tests:
          - not_null
      - name: longitude
        data_type: double
        description: "WGS84 centroid longitude of the project line."
        tests:
          - not_null

  - name: mart_restaurants
    description: "One row per restaurant (permit), joining SNHD establishment detail (name, address, geo, current grade) to aggregated inspection history. Establishments with no inspections keep zeroed counts."
    config:
      contract:
        enforced: true
    columns:
      - name: permit_number
        data_type: varchar
        description: "Unique SNHD permit number for the establishment (the grain of this table)."
        tests:
          - not_null
          - unique
      - name: restaurant_name
        data_type: varchar
        description: "Establishment name from the SNHD developer bundle."
      - name: address
        data_type: varchar
        description: "Street address of the establishment."
      - name: city_name
        data_type: varchar
        description: "City the establishment is in (Clark County-wide)."
      - name: zip_code
        data_type: varchar
        description: "ZIP code of the establishment."
      - name: latitude
        data_type: double
        description: "WGS84 latitude (lat/lon are un-swapped from the source in staging)."
      - name: longitude
        data_type: double
        description: "WGS84 longitude."
      - name: status
        data_type: varchar
        description: "Establishment status decoded from the source (e.g. Active)."
      - name: current_grade
        data_type: varchar
        description: "Most recent letter grade on file (A/B/C/...)."
      - name: current_demerits
        data_type: integer
        description: "Demerits recorded on the most recent inspection."
      - name: date_current
        data_type: date
        description: "Date the current grade/demerits were recorded."
      - name: total_inspections
        data_type: bigint
        description: "Count of inspections on record (0 if none)."
        tests:
          - not_null
      - name: avg_demerits
        data_type: double
        description: "Mean demerits across the establishment's inspections (null if none)."
      - name: worst_demerits
        data_type: integer
        description: "Maximum demerits on any single inspection."
      - name: first_inspection
        data_type: date
        description: "Earliest inspection date on record."
      - name: last_inspection
        data_type: date
        description: "Most recent inspection date on record."
      - name: compliant_count
        data_type: hugeint
        description: "Number of inspections marked compliant."
      - name: non_compliant_count
        data_type: hugeint
        description: "Number of inspections marked non-compliant."
      - name: downgrades
        data_type: hugeint
        description: "Number of inspections that were a B/C downgrade."
      - name: closures
        data_type: hugeint
        description: "Number of inspections that resulted in a closure."
      - name: failed_inspections
        data_type: hugeint
        description: "Inspections that were a downgrade or a closure (downgrades + closures)."
        tests:
          - not_null
      - name: total_violations
        data_type: hugeint
        description: "Total violations cited across all inspections."
      - name: compliance_rate_pct
        data_type: double
        description: "compliant_count / total_inspections as a percentage (null when no inspections)."
      - name: failure_rate_pct
        data_type: double
        description: "failed_inspections / total_inspections as a percentage — the governed restaurant_failure_rate metric (null when no inspections)."

  - name: mart_inspections_over_time
    description: "Monthly inspection counts and compliance rates by inspection type."
    config:
      contract:
        enforced: true
    columns:
      - name: inspection_month
        data_type: timestamp
        description: "Month the inspections occurred (truncated to the first of the month)."
        tests:
          - not_null
      - name: inspection_type
        data_type: varchar
        description: "SNHD inspection type (routine, re-inspection, etc.)."
      - name: inspection_count
        data_type: bigint
        description: "Number of inspections of this type that month."
        tests:
          - not_null
      - name: avg_demerits
        data_type: double
        description: "Mean demerits across those inspections."
      - name: compliant_count
        data_type: hugeint
        description: "Number of those inspections marked compliant."
      - name: non_compliant_count
        data_type: hugeint
        description: "Number of those inspections marked non-compliant."
      - name: compliance_rate_pct
        data_type: double
        description: "compliant_count / inspection_count as a percentage."

  - name: mart_inspection_history
    description: "One row per inspection, keyed on permit_number for per-restaurant drill-down (date, type, grade, result, demerits, violation count)."
    config:
      contract:
        enforced: true
    columns:
      - name: permit_number
        data_type: varchar
        description: "Restaurant permit number"
        tests:
          - not_null
      - name: serial_number
        data_type: varchar
        description: "Unique inspection identifier"
        tests:
          - not_null
      - name: inspection_date
        data_type: date
        description: "Date of the inspection."
      - name: inspection_type
        data_type: varchar
        description: "SNHD inspection type description as published (match with ILIKE patterns; exact values are not documented here)."
      - name: inspection_grade
        data_type: varchar
        description: "Grade code assigned at this inspection, as published by SNHD (A/B/C/F/N/P/S/O and others)."
      - name: inspection_result
        data_type: varchar
        description: "SNHD inspection result description."
      - name: inspection_demerits
        data_type: integer
        description: "Demerits assessed at this inspection; higher is worse."
      - name: violation_count
        data_type: bigint
        description: "Number of violations cited at this inspection."

  - name: mart_inspection_violations
    description: "One row per (inspection, violation), decoding violation codes to descriptions and demerit weights. Keyed on serial_number and permit_number."
    config:
      contract:
        enforced: true
    columns:
      - name: serial_number
        data_type: varchar
        description: "Inspection identifier the violation was cited on."
        tests:
          - not_null
      - name: permit_number
        data_type: varchar
        description: "Restaurant permit the inspection belongs to (joins to mart_restaurants)."
      - name: inspection_date
        data_type: date
        description: "Date of the inspection the violation was cited on."
      - name: violation_code
        data_type: varchar
        description: "Cited violation code."
        tests:
          - not_null
      - name: violation_description
        data_type: varchar
        description: "Human-readable description decoded from the violation code."
      - name: violation_demerits
        data_type: integer
        description: "Demerit weight assigned to this violation code."

  - name: mart_top_violations
    description: "Violation-code frequency by category and inspection type."
    config:
      contract:
        enforced: true
    columns:
      - name: violation_code
        data_type: varchar
        description: "Individual violation code."
        tests:
          - not_null
      - name: violation_description
        data_type: varchar
        description: "Human-readable description decoded from the violation code."
      - name: violation_demerits
        data_type: integer
        description: "Demerit weight assigned to this violation code."
      - name: inspection_type
        data_type: varchar
        description: "Inspection type the citations were grouped under."
      - name: inspection_grade
        data_type: varchar
        description: "Inspection grade the citations were grouped under."
      - name: occurrence_count
        data_type: bigint
        description: "Number of times this violation was cited in the group."
        tests:
          - not_null

  - name: mart_fire_prevention_inspections
    description: "One row per property summarizing fire prevention inspection history and violation totals"
    config:
      contract:
        enforced: true
    columns:
      - name: property_name
        data_type: varchar
        description: "Name of the inspected residential property"
      - name: Address
        data_type: varchar
        description: "Street address of the property."
      - name: City
        data_type: varchar
        description: "City of the property."
      - name: Zip
        data_type: double
        description: "ZIP code (stored as a number)."
      - name: unit_count
        data_type: integer
        description: "Number of residential units at the property."
      - name: latitude
        data_type: double
        description: "WGS84 latitude parsed from the source location field."
      - name: longitude
        data_type: double
        description: "WGS84 longitude parsed from the source location field."
      - name: inspection_count
        data_type: bigint
        description: "Number of inspection periods on record for this property"
        tests:
          - not_null
      - name: most_recent_inspection
        data_type: date
        description: "Most recent last-inspected date across the property's inspection periods."
      - name: total_violations
        data_type: double
        description: "Total violations written across all inspection periods"
        tests:
          - not_null
      - name: avg_violations_per_period
        data_type: double
        description: "Mean violations written per inspection period, rounded to 2 decimals."
      - name: avg_pct_dwellings_with_violations
        data_type: double
        description: "Average percentage of dwellings with violations across all inspections"
      - name: first_fiscal_year
        data_type: integer
        description: "Earliest fiscal year with an inspection period for this property."
      - name: last_fiscal_year
        data_type: integer
        description: "Latest fiscal year with an inspection period for this property."

  - name: mart_art_work_points
    description: "City of Las Vegas public art collection with coordinates and parsed metadata, ready for mapping"
    config:
      contract:
        enforced: true
    columns:
      - name: ObjectId
        data_type: bigint
        description: "Stable public-art record id (the grain of this table)."
        tests:
          - not_null
          - unique
      - name: artwork_name
        data_type: varchar
        description: "Title and year of the artwork"
      - name: artist
        data_type: varchar
        description: "Artist name"
      - name: medium
        data_type: varchar
        description: "Artwork medium/materials."
      - name: location_detail
        data_type: varchar
        description: "Free-text placement detail (building, park, intersection)."
      - name: address
        data_type: varchar
        description: "Street address of the artwork's site."
      - name: ward
        data_type: varchar
        description: "City of Las Vegas council ward containing the artwork."
      - name: latitude
        data_type: double
        description: "Latitude coordinate for map placement"
        tests:
          - not_null
      - name: longitude
        data_type: double
        description: "Longitude coordinate for map placement"
        tests:
          - not_null
      - name: PIC_URL
        data_type: varchar
        description: "URL of the artwork's full-size photo."
      - name: THUMB_URL
        data_type: varchar
        description: "URL of the artwork's thumbnail photo."

  - name: mart_crime_by_type
    description: "LVMPD calls-for-service counts by classification and incident type. Covers calls from 2025-2026 only (the latest month is partial); no earlier years are loaded."
    config:
      contract:
        enforced: true
    columns:
      - name: classification
        data_type: varchar
        description: "LVMPD call classification (broad category of the call)."
      - name: incident_type
        data_type: varchar
        description: "LVMPD incident type description (specific call type)."
      - name: incident_count
        data_type: bigint
        description: "Number of LVMPD calls for service with this classification and incident type, 2025-2026. These are calls for service, not confirmed crimes."
        tests:
          - not_null

  - name: mart_crime_by_hour_weekday
    description: "LVMPD calls-for-service counts by hour of day and day of week, for a heatmap. Covers 2025-2026 only."
    config:
      contract:
        enforced: true
    columns:
      - name: weekday
        data_type: varchar
        description: "Day of week as a full English name ('Monday' ... 'Sunday')."
      - name: hour_of_day
        data_type: integer
        description: "Hour of day the call was received, 0-23."
      - name: incident_count
        data_type: bigint
        description: "Number of LVMPD calls for service in this weekday/hour cell, 2025-2026."
        tests:
          - not_null

  - name: mart_crime_monthly
    description: "LVMPD calls for service per month. Covers 2025-2026 only (the latest month is partial); months outside that window have no rows, not zero calls."
    config:
      contract:
        enforced: true
    columns:
      - name: incident_month
        data_type: timestamp
        description: "First day of the calendar month (timestamp)."
        tests:
          - not_null
      - name: incident_count
        data_type: bigint
        description: "Number of LVMPD calls for service in the month."
      - name: distinct_types
        data_type: bigint
        description: "Number of distinct incident types seen in the month."

  - name: mart_crime_map_sample
    description: "A ~12k-row random sample of geolocated calls (bounded to the valley) for mapping."
    config:
      contract:
        enforced: true
    columns:
      - name: incident_number
        data_type: varchar
        description: "LVMPD incident number."
      - name: incident_type
        data_type: varchar
        description: "LVMPD incident type description."
      - name: classification
        data_type: varchar
        description: "LVMPD call classification."
      - name: incident_date
        data_type: timestamp
        description: "Timestamp of the call."
      - name: address
        data_type: varchar
        description: "Address of the call as published by LVMPD."
      - name: latitude
        data_type: double
        description: "WGS84 latitude (bounded to the valley)."
      - name: longitude
        data_type: double
        description: "WGS84 longitude (bounded to the valley)."

  - name: mart_permits_monthly
    description: "City of Las Vegas building permits per month with total and average valuation."
    config:
      contract:
        enforced: true
    columns:
      - name: issue_month
        data_type: timestamp
        description: "First day of the month the permits were issued (timestamp)."
        tests:
          - not_null
      - name: permit_count
        data_type: bigint
        description: "City of Las Vegas building permits issued in the month."
      - name: total_valuation
        data_type: double
        description: "Sum of declared project valuation (USD) for permits issued in the month."
      - name: avg_valuation
        data_type: double
        description: "Mean declared project valuation (USD) per permit, rounded to whole dollars."

  - name: mart_permits_by_type
    description: "Building permit counts and valuation by application type."
    config:
      contract:
        enforced: true
    columns:
      - name: application_type
        data_type: varchar
        description: "City of Las Vegas permit application type ('Unknown' when missing)."
        tests:
          - not_null
      - name: permit_count
        data_type: bigint
        description: "Number of permits of this application type across all loaded years."
      - name: total_valuation
        data_type: double
        description: "Sum of declared project valuation (USD) for this application type."
      - name: avg_valuation
        data_type: double
        description: "Mean declared project valuation (USD) per permit, rounded to whole dollars."

  # TEMPORARILY DISABLED with the CLV Business Licenses feed (see the models'
  # enabled=false config + build_warehouse.py). Re-enable these blocks alongside
  # the models when the upstream layer recovers.
  # - name: mart_business_licenses
  #   description: "One row per City of Las Vegas business license for the searchable roster."
  #   columns:
  #     - name: license_no
  #       description: "Business license number (may repeat across renewals)."
  #
  # - name: mart_licenses_by_type
  #   description: "Business license counts (and active counts) by type of business."
  #   columns:
  #     - name: type_of_business
  #       tests:
  #         - not_null

  - name: mart_short_term_rentals
    description: "Metro-wide short-term rentals (Las Vegas, North Las Vegas, Henderson) with jurisdiction and WGS84 coordinates for mapping."
    config:
      contract:
        enforced: true
    columns:
      - name: jurisdiction
        data_type: varchar
        description: "City that licensed the rental: Las Vegas, North Las Vegas, or Henderson."
        tests:
          - not_null
      - name: business_name
        data_type: varchar
        description: "Las Vegas: business name. North Las Vegas: the property OWNER (not a business). Henderson: business name."
      - name: status
        data_type: varchar
        description: "Las Vegas: license status as published; Henderson: status as published; North Las Vegas: always 'Approved' (set by our loader; NLV publishes only approved rentals)."
      - name: category
        data_type: varchar
        description: "Las Vegas: business type as published. Henderson: 'Max occupancy N' derived by our loader from the max-occupancy field (not a license category). North Las Vegas: null. Not comparable across jurisdictions."
      - name: address
        data_type: varchar
        description: "Street address of the rental."
      - name: issued_date
        data_type: date
        description: "Las Vegas and Henderson: license issue date. North Las Vegas: approval date."
      - name: latitude
        data_type: double
        description: "WGS84 latitude of the rental."
        tests:
          - not_null
      - name: longitude
        data_type: double
        description: "WGS84 longitude of the rental."
        tests:
          - not_null

  - name: mart_henderson_permits
    description: "City of Henderson building permits per month by case type."
    config:
      contract:
        enforced: true
    columns:
      - name: issue_month
        data_type: timestamp
        description: "First day of the month the permits were issued (timestamp)."
        tests:
          - not_null
      - name: case_type
        data_type: varchar
        description: "City of Henderson permit case type ('Unknown' when missing)."
      - name: permit_count
        data_type: bigint
        description: "Henderson permits of this case type issued in the month."

  - name: mart_henderson_licenses_by_type
    description: "City of Henderson business license counts (and active counts) by license type."
    config:
      contract:
        enforced: true
    columns:
      - name: license_type
        data_type: varchar
        description: "City of Henderson business license type ('Unknown' when missing)."
        tests:
          - not_null
      - name: license_count
        data_type: bigint
        description: "Number of Henderson business licenses of this type (any status)."
      - name: active_count
        data_type: hugeint
        description: "Number of those licenses whose status is 'active' (case-insensitive)."

  - name: mart_parks
    description: "Metro-wide parks with jurisdiction, centroid coordinates, acreage, and a has_water flag (true/false where published, else null)."
    config:
      contract:
        enforced: true
    columns:
      - name: jurisdiction
        data_type: varchar
        description: "Metro jurisdiction that publishes the park: Las Vegas, Henderson, North Las Vegas, or Clark County."
        tests:
          - not_null
      - name: park_name
        data_type: varchar
        description: "Park name."
        tests:
          - not_null
      - name: address
        data_type: varchar
        description: "Park street address, where published."
      - name: acres
        data_type: double
        description: "Park size in acres, where published."
      - name: has_water
        data_type: boolean
        description: "Las Vegas: inferred by our loader via a spatial join of city water-feature points into the park polygon (false when the park has no geometry). Henderson: true when the swimming or water-play field says yes. Clark County and North Las Vegas: null (no attribute published)."
      - name: latitude
        data_type: double
        description: "WGS84 centroid latitude."
      - name: longitude
        data_type: double
        description: "WGS84 centroid longitude."

  - name: mart_marriage_monthly
    description: "Clark County marriage licenses per month, 2007-2025."
    config:
      contract:
        enforced: true
    columns:
      - name: license_month
        data_type: timestamp
        description: "First day of the calendar month (timestamp)."
        tests:
          - not_null
      - name: license_count
        data_type: bigint
        description: "Clark County marriage licenses issued in the month."

  - name: mart_marriage_daily
    description: "Marriage licenses per calendar day, 2007-2025, for spotting Valentine's / NYE / novelty-date spikes."
    config:
      contract:
        enforced: true
    columns:
      - name: license_date
        data_type: date
        description: "Calendar date the license was issued."
        tests:
          - not_null
      - name: month_of_year
        data_type: bigint
        description: "Month number 1-12 of license_date."
      - name: day_of_month
        data_type: bigint
        description: "Day number 1-31 of license_date."
      - name: license_count
        data_type: bigint
        description: "Clark County marriage licenses issued that day."

  - name: mart_marriage_by_origin
    description: "Marriage licenses by mailing origin (US state, else country), 2007-2025."
    config:
      contract:
        enforced: true
    columns:
      - name: origin
        data_type: varchar
        description: "Couple's mailing origin, upper-cased and trimmed in staging: the US state when the country is UNITED STATES/USA/US and a state is present; otherwise the country (so a US address with no state appears as the country value); 'UNKNOWN' when both are missing."
        tests:
          - not_null
      - name: license_count
        data_type: bigint
        description: "Clark County marriage licenses from this origin across all loaded years."

  - name: mart_marriage_by_gender_year
    description: "Same-sex vs different-sex marriage licenses per year, 2007-2025."
    config:
      contract:
        enforced: true
    columns:
      - name: license_year
        data_type: bigint
        description: "Calendar year the license was issued."
        tests:
          - not_null
      - name: couple_type
        data_type: varchar
        description: "'Same-sex' when both parties share a recorded gender, else 'Different-sex'. Licenses missing either gender are excluded. Nevada began issuing same-sex licenses in October 2014."
      - name: license_count
        data_type: bigint
        description: "Marriage licenses of this couple type in the year."

  - name: mart_lake_mead_monthly
    description: "Monthly average / min / max Lake Mead elevation (feet)."
    config:
      contract:
        enforced: true
    columns:
      - name: reading_month
        data_type: timestamp
        description: "First day of the calendar month (timestamp)."
        tests:
          - not_null
      - name: avg_elevation_ft
        data_type: double
        description: "Mean daily Lake Mead surface elevation in the month, feet above sea level."
      - name: min_elevation_ft
        data_type: double
        description: "Lowest daily elevation reading in the month, feet."
      - name: max_elevation_ft
        data_type: double
        description: "Highest daily elevation reading in the month, feet."

  - name: mart_weather_monthly
    description: "Monthly average high/low and record high/low at the Las Vegas airport station."
    config:
      contract:
        enforced: true
    columns:
      - name: observed_month
        data_type: timestamp
        description: "First day of the calendar month (timestamp)."
        tests:
          - not_null
      - name: avg_high_f
        data_type: double
        description: "Mean daily maximum temperature in the month, degrees F (Las Vegas airport station)."
      - name: avg_low_f
        data_type: double
        description: "Mean daily minimum temperature in the month, degrees F."
      - name: record_high_f
        data_type: double
        description: "Highest daily maximum temperature in the month, degrees F."
      - name: record_low_f
        data_type: double
        description: "Lowest daily minimum temperature in the month, degrees F."

  - name: mart_weather_extreme_days
    description: "Count of 100F+ and 110F+ days per year, plus average daily high."
    config:
      contract:
        enforced: true
    columns:
      - name: observed_year
        data_type: bigint
        description: "Calendar year (the latest year may be partial)."
        tests:
          - not_null
      - name: days_100f_plus
        data_type: hugeint
        description: "Days in the year with a daily high of at least 100 F."
      - name: days_110f_plus
        data_type: hugeint
        description: "Days in the year with a daily high of at least 110 F."
      - name: avg_high_f
        data_type: double
        description: "Mean daily maximum temperature over the year, degrees F."

  - name: mart_lvcva_indicators
    description: "Long-form monthly LVCVA indicators (metric, month, value): visitor volume, occupancy, ADR, airport passengers, gaming revenue by area."
    config:
      contract:
        enforced: true
    columns:
      - name: metric
        data_type: varchar
        description: "LVCVA indicator name (free text), e.g. 'Visitor Volume', names containing 'En/Deplaned Passengers', and 'Gaming Revenue <area>' (the colon is optional). Gaming revenue includes a Clark County total alongside its sub-areas: exclude ILIKE '%Clark County%' when summing areas, or use only the Clark County row for a county total. Match with ILIKE patterns rather than exact strings."
        tests:
          - not_null
      - name: indicator_month
        data_type: date
        description: "First day of the month the indicator value covers."
        tests:
          - not_null
      - name: value
        data_type: double
        description: "Indicator value for the month, in the indicator's own unit (count, percent, USD, ...)."

  - name: mart_air_quality_daily
    description: "Daily worst-site AQI and average concentration by pollutant (PM2.5 / ozone) across the Las Vegas metro (Clark County), from 2015 onward."
    config:
      contract:
        enforced: true
    columns:
      - name: observed_date
        data_type: date
        description: "Calendar date of the observations."
      - name: parameter
        data_type: varchar
        description: "Pollutant label set by our loader from the EPA AQS parameter code: exactly 'PM2.5' (88101) or 'Ozone' (44201)."
      - name: max_aqi
        data_type: integer
        description: "Worst (maximum) AQI across Clark County monitoring sites that day; the standard way to report a day's air quality."
      - name: avg_concentration
        data_type: double
        description: "Mean concentration across sites that day (2 decimals), in the pollutant's own unit: PM2.5 in micrograms/m3, ozone in ppm. Never compare or average across parameters."

  - name: mart_air_quality_monthly
    description: "Monthly average and peak AQI by pollutant for Clark County, from 2015 onward."
    config:
      contract:
        enforced: true
    columns:
      - name: observed_month
        data_type: timestamp
        description: "First day of the calendar month (timestamp)."
      - name: parameter
        data_type: varchar
        description: "Pollutant label: exactly 'PM2.5' or 'Ozone'."
      - name: avg_aqi
        data_type: double
        description: "Mean of the daily worst-site AQI over the month, rounded to a whole number."
      - name: peak_aqi
        data_type: integer
        description: "Highest daily worst-site AQI in the month."

