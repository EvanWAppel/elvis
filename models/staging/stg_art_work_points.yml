version: 2

models:
  - name: stg_art_work_points
    description: "Cleaned City of Las Vegas public art records with parsed description fields and typed coordinates"
    columns:
      - name: objectid
        description: "Unique record identifier"
        tests:
          - not_null
          - unique

      - name: artwork_name
        description: "Title and year of the artwork"
        tests:
          - not_null

      - name: artist
        description: "Artist name, parsed from pipe-delimited description"

      - name: medium
        description: "Artistic medium, parsed from pipe-delimited description"

      - name: location_detail
        description: "Building/floor location detail, parsed from pipe-delimited description"

      - name: address
        description: "Street address of the artwork, parsed from pipe-delimited description"

      - name: ward
        description: "City council ward (normalized to 'Ward N'), extracted by regex from the description. Null for UNLV campus / county pieces that have no council ward."

      - name: latitude
        description: "Latitude coordinate. Bounds match METRO_BBOX in build_warehouse.py."
        tests:
          - not_null
          # Feed-derived coordinate — `warn` so an off-valley point signals without
          # aborting the production dbt build / deploy.
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 35.8
              max_value: 36.4
              config:
                severity: warn

      - name: longitude
        description: "Longitude coordinate. Bounds match METRO_BBOX in build_warehouse.py."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: -115.5
              max_value: -114.9
              config:
                severity: warn
