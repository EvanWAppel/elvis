version: 2

models:
  - name: stg_snhd_establishments
    description: "One row per SNHD restaurant establishment: permit_number to name, address, geo, and current grade."
    columns:
      - name: permit_number
        description: "Unique restaurant permit number"
        tests:
          - not_null
          - unique

      - name: restaurant_name
        description: "Establishment name"

      - name: latitude
        description: "Latitude (source columns are swapped and corrected here)"

      - name: longitude
        description: "Longitude (source columns are swapped and corrected here)"

      - name: status
        description: >
          Establishment status decoded from SNHD record_status codes 01-05 in the
          staging CASE; unknown codes pass through unchanged. The code domain is
          the feed's, so this is a `warn` known-values signal (DECISIONS 2026-09-26).
        tests:
          - accepted_values:
              values:
                - "Active"
                - "Inactive"
                - "Temporarily inactive"
                - "Active (billing-exempt)"
                - "Inactive (billable)"
              config:
                severity: warn
