version: 2

sources:
  - name: raw
    database: vegas
    schema: raw
    tables:
      - name: snhd_inspections
        description: "SNHD restaurant inspection facts (2020-present) from the nightly developer bundle. Keyed on permit_number; violation codes are comma-separated."
      - name: snhd_establishments
        description: "SNHD restaurant establishments: permit_number to restaurant name, address, geo coordinates, and current grade."
      - name: snhd_violations
        description: "SNHD violation-code reference: code to description and demerit weight."
      - name: snhd_inspection_types
        description: "Lookup mapping inspection_type_id to a human-readable inspection type."
      - name: fire_prevention_inspections
        description: "City of Las Vegas fire prevention inspection records for multi-unit residential properties"
      - name: art_work_points
        description: "City of Las Vegas public art collection with coordinates parsed from source fields"
      - name: crime_calls
        description: "LVMPD calls-for-service for the two most recent years, with incident type, time-of-day fields, zip, and WGS84 coordinates."
      - name: building_permits
        description: "City of Las Vegas archived building permits with valuation and issue date (non-spatial)."
      - name: business_licenses
        description: "City of Las Vegas business license registry: name, type, status, zip, city-limits flag (non-spatial)."
      - name: short_term_rentals
        description: "City of Las Vegas short-term rental licenses with status, category, and WGS84 point coordinates."
      - name: parks
        description: "City of Las Vegas parks with type, acreage, ward, and polygon-centroid WGS84 coordinates."
