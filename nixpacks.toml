# Railway/Nixpacks build config.
#
# The DuckDB warehouse must be baked into the image at BUILD time: Railway's
# release phase runs in a throwaway container whose filesystem is discarded
# before the web process starts, so a Procfile `release` step would leave the
# live app with no vegas.duckdb. Building here (after deps are installed) bakes
# the freshly-built warehouse into the deployed image. The DB stays out of git.

providers = ["python"]

[phases.build]
dependsOn = ["install"]
cmds = [
  "python build_warehouse.py",
  "dbt build --profiles-dir .",
]
